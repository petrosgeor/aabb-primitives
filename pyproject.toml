[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aabb-primitives"
version = "0.2.0"
description = "Pairwise AABB geometry, predicates, and contact patches with Torch tensors."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Petros Georgoulas Wraight" },
]
dependencies = [
    "beartype",
    "jaxtyping",
    "torch",
]

[project.optional-dependencies]
examples = [
    "numpy",
    "plotly",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aabb_primitives"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/examples", "/docs/assets", "/docs/reference.md",
    "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/.python-version",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["presentation", ".presentation-work", ".uv-python"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Jaxtyping shape strings are not Python forward-reference expressions.
# Undefined-name checks stay enabled outside these shape expressions.
"src/aabb_primitives/relations.py" = ["F722"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true
